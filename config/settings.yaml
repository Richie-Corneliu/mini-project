stream:
  source: https://cctv.dev.banyumaskab.go.id/cctv_simpang_museum_bri/video1_stream.m3u8
  reconnect: true
  max_retries: 5
  backoff_sec: 2.0
  queue_size: 3
  gap_thresh_sec: 0.5
  target_fps: 15
  throttle_fps: 0.7
zones:
- name: underpass
  polygon:
  - - 22
    - 140
  - - 47
    - 391
  - - 678
    - 330
  - - 605
    - 161
lines:
  items:
  - p1:
    - 30
    - 340
    p2:
    - 674
    - 340
    direction: up
    name: garis
detector:
  conf: 0.2
  model: rtdetr-l.engine
  device: cuda:0
  duplicate_iou: 0.65
  imgsz: 640
  half: true
  classes:
  - 2
  - 3
  - 5
  - 7
  min_area: 20
  show_dims: true
  tracker_config:
    lost_track_buffer: 90
    track_activation_threshold: 0.2
    minimum_consecutive_frames: 1
    minimum_iou_threshold_first_assoc: 0.25
    minimum_iou_threshold_second_assoc: 0.75
counter:
  dedup_cooldown_sec: 4.0
  dedup_radius_px: 10
  min_displacement_px: 50
  class_window: 15
  cabin_iou: 0.6
  cabin_area_ratio: 0.55
  still_count_frames: 30
  still_min_conf: 0.35
harvest:
  output_dir: dataset/raw_images
  interval_sec: 2.0
  prefix: frame
  jpeg_quality: 90
logging:
  level: INFO
  file: logs/app.log
